<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ggplot2 grammar of graphics layers</title>
  <desc>Three stacked panels — data, aesthetic mappings, and geom layer — combined with plus signs to produce a scatter plot on the right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ LAYER 1: DATA ============ -->
  <text x="90" y="14" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5" fill="#2E86C1" style="fill:#2E86C1;font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:10px;font-weight:600">DATA</text>

  <rect x="20" y="24" width="140" height="18" fill="var(--color-background-secondary)" stroke="#2E86C1" stroke-width="1" style="fill:rgb(245, 244, 237);stroke:#2E86C1;stroke-width:1px"/>
  <rect x="20" y="42" width="140" height="18" fill="var(--color-background-primary)" stroke="#2E86C1" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:#2E86C1;stroke-width:0.5px;opacity:0.6"/>
  <rect x="20" y="60" width="140" height="18" fill="var(--color-background-primary)" stroke="#2E86C1" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:#2E86C1;stroke-width:0.5px;opacity:0.6"/>
  <rect x="20" y="78" width="140" height="18" fill="var(--color-background-primary)" stroke="#2E86C1" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:#2E86C1;stroke-width:0.5px;opacity:0.6"/>
  <line x1="90" y1="24" x2="90" y2="96" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>

  <text x="55" y="33" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">weight_mg</text>
  <text x="125" y="33" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">absorbance</text>
  <text x="55" y="51" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">498.2</text>
  <text x="125" y="51" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">0.149</text>
  <text x="55" y="69" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">501.0</text>
  <text x="125" y="69" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">0.153</text>
  <text x="55" y="87" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">505.4</text>
  <text x="125" y="87" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">0.161</text>

  <text x="90" y="112" text-anchor="middle" dominant-baseline="central" fill="#2E86C1" style="fill:#2E86C1;font-family:ui-monospace, monospace;font-size:9px">ggplot(tablets)</text>

  <!-- plus -->
  <text x="188" y="60" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-tertiary)" style="fill:rgb(115, 114, 108);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:16px">+</text>

  <!-- ============ LAYER 2: AESTHETICS ============ -->
  <text x="278" y="14" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5" fill="#2E8B57" style="fill:#2E8B57;font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:10px;font-weight:600">AESTHETICS</text>

  <rect x="216" y="24" width="124" height="72" fill="var(--color-background-secondary)" stroke="#2E8B57" stroke-width="1" style="fill:rgb(245, 244, 237);stroke:#2E8B57;stroke-width:1px"/>

  <!-- mapping rows: column -> channel -->
  <text x="228" y="48" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">weight_mg</text>
  <line x1="286" y1="48" x2="306" y2="48" stroke="var(--color-border-primary)" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115, 114, 108);stroke-width:1px"/>
  <text x="312" y="48" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">x</text>

  <text x="228" y="72" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">absorbance</text>
  <line x1="290" y1="72" x2="306" y2="72" stroke="var(--color-border-primary)" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115, 114, 108);stroke-width:1px"/>
  <text x="312" y="72" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">y</text>

  <text x="278" y="112" text-anchor="middle" dominant-baseline="central" fill="#2E8B57" style="fill:#2E8B57;font-family:ui-monospace, monospace;font-size:9px">aes(x, y)</text>

  <!-- plus -->
  <text x="368" y="60" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-tertiary)" style="fill:rgb(115, 114, 108);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:16px">+</text>

  <!-- ============ LAYER 3: GEOM ============ -->
  <text x="446" y="14" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5" fill="#E05C3A" style="fill:#E05C3A;font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:10px;font-weight:600">GEOM LAYER</text>

  <rect x="396" y="24" width="100" height="72" fill="var(--color-background-secondary)" stroke="#E05C3A" stroke-width="1" style="fill:rgb(245, 244, 237);stroke:#E05C3A;stroke-width:1px"/>

  <!-- geom glyph samples -->
  <circle cx="416" cy="42" r="3.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <text x="430" y="42" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">geom_point</text>

  <path d="M410 65 L416 59 L422 64 L428 57" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px;opacity:0.45"/>
  <text x="436" y="61" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">geom_line</text>

  <rect x="410" y="76" width="5" height="10" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px;opacity:0.45"/>
  <rect x="417" y="80" width="5" height="6" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px;opacity:0.45"/>
  <text x="430" y="81" dominant-baseline="central" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:10px">geom_col</text>

  <text x="446" y="112" text-anchor="middle" dominant-baseline="central" fill="#E05C3A" style="fill:#E05C3A;font-family:ui-monospace, monospace;font-size:9px">geom_point()</text>

  <!-- ============ ARROW TO PLOT ============ -->
  <line x1="508" y1="60" x2="536" y2="60" stroke="var(--color-border-primary)" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115, 114, 108);stroke-width:1.5px"/>

  <!-- ============ RESULT: PLOT ============ -->
  <text x="606" y="14" text-anchor="middle" dominant-baseline="central" letter-spacing="0.5" fill="var(--color-text-tertiary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:10px">PLOT</text>

  <rect x="546" y="24" width="114" height="72" fill="var(--color-background-primary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>
  <!-- axes -->
  <line x1="564" y1="34" x2="564" y2="82" stroke="var(--color-border-primary)" stroke-width="1" style="stroke:rgb(115, 114, 108);stroke-width:1px"/>
  <line x1="564" y1="82" x2="648" y2="82" stroke="var(--color-border-primary)" stroke-width="1" style="stroke:rgb(115, 114, 108);stroke-width:1px"/>
  <!-- points -->
  <circle cx="578" cy="74" r="2.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <circle cx="594" cy="66" r="2.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <circle cx="606" cy="60" r="2.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <circle cx="618" cy="54" r="2.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <circle cx="632" cy="44" r="2.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <circle cx="641" cy="40" r="2.5" fill="none" stroke="#E05C3A" stroke-width="1.2" style="fill:none;stroke:#E05C3A;stroke-width:1.2px"/>
  <!-- axis labels -->
  <text x="606" y="91" text-anchor="middle" dominant-baseline="central" fill="#2E8B57" style="fill:#2E8B57;font-family:ui-monospace, monospace;font-size:8px">weight_mg</text>
  <text x="556" y="58" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 556 58)" fill="#2E8B57" style="fill:#2E8B57;font-family:ui-monospace, monospace;font-size:8px">absorbance</text>

  <text x="606" y="112" text-anchor="middle" dominant-baseline="central" fill="var(--color-text-tertiary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:9px">rendered output</text>

  <!-- ============ CODE STRIP ============ -->
  <line x1="20" y1="134" x2="660" y2="134" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <text x="20" y="152" dominant-baseline="central" style="font-family:ui-monospace, monospace;font-size:11px"><tspan fill="#2E86C1" style="fill:#2E86C1">ggplot(tablets)</tspan><tspan fill="var(--color-text-tertiary)" style="fill:rgb(115, 114, 108)"> +</tspan></text>
  <text x="36" y="170" dominant-baseline="central" style="font-family:ui-monospace, monospace;font-size:11px"><tspan fill="#2E8B57" style="fill:#2E8B57">aes(x = weight_mg, y = absorbance)</tspan><tspan fill="var(--color-text-tertiary)" style="fill:rgb(115, 114, 108)"> +</tspan></text>
  <text x="36" y="188" dominant-baseline="central" style="font-family:ui-monospace, monospace;font-size:11px"><tspan fill="#E05C3A" style="fill:#E05C3A">geom_point()</tspan></text>
</svg>
