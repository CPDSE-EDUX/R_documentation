<svg width="100%" viewBox="0 0 700 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>lag() and lead() row-shift diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ══════════════ PANEL 1 — lag() ══════════════ -->

  <text x="40" y="16" font-family="monospace" font-size="12" fill="#555">lag(pct_dissolved)</text>
  <text x="40" y="31" font-family="sans-serif" font-size="10" fill="#999">each row copies the value from the row above (n = 1)</text>

  <!-- header -->
  <rect x="40"  y="42" width="70" height="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="42" width="90" height="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="42" width="90" height="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888">time_min</text>
  <text x="155" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888">pct_dissolved</text>
  <text x="263" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888">previous_pct</text>

  <!-- rows -->
  <rect x="40"  y="62" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="62" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="62" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="71" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">5</text>
  <text x="155" y="71" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">32.1</text>
  <text x="263" y="71" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" font-style="italic" fill="#aaa">NA</text>

  <rect x="40"  y="80" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="80" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="80" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="89" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">10</text>
  <text x="155" y="89" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">53.9</text>
  <text x="263" y="89" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">32.1</text>

  <rect x="40"  y="98" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="98" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="98" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="107" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">15</text>
  <text x="155" y="107" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">70.6</text>
  <text x="263" y="107" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">53.9</text>

  <rect x="40"  y="116" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="116" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="116" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="125" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">20</text>
  <text x="155" y="125" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">79.2</text>
  <text x="263" y="125" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">70.6</text>

  <rect x="40"  y="134" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="134" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="134" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="143" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">30</text>
  <text x="155" y="143" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">88.6</text>
  <text x="263" y="143" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">79.2</text>

  <!-- shift connectors: each pct_dissolved value drops down into the next row's previous_pct cell -->
  <line x1="200" y1="71"  x2="218" y2="89"  stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="89"  x2="218" y2="107" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="107" x2="218" y2="125" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="125" x2="218" y2="143" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ══════════════ PANEL 2 — lead() ══════════════ -->

  <text x="40" y="194" font-family="monospace" font-size="12" fill="#555">lead(pct_dissolved)</text>
  <text x="40" y="209" font-family="sans-serif" font-size="10" fill="#999">each row copies the value from the row below (n = 1)</text>

  <!-- header -->
  <rect x="40"  y="220" width="70" height="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="220" width="90" height="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="220" width="90" height="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="230" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888">time_min</text>
  <text x="155" y="230" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888">pct_dissolved</text>
  <text x="263" y="230" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#888">next_pct</text>

  <!-- rows -->
  <rect x="40"  y="240" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="240" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="240" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="249" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">5</text>
  <text x="155" y="249" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">32.1</text>
  <text x="263" y="249" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">53.9</text>

  <rect x="40"  y="258" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="258" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="258" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="267" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">10</text>
  <text x="155" y="267" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">53.9</text>
  <text x="263" y="267" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">70.6</text>

  <rect x="40"  y="276" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="276" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="276" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="285" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">15</text>
  <text x="155" y="285" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">70.6</text>
  <text x="263" y="285" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">79.2</text>

  <rect x="40"  y="294" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="294" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="294" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="303" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">20</text>
  <text x="155" y="303" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">79.2</text>
  <text x="263" y="303" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">88.6</text>

  <rect x="40"  y="312" width="70" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="110" y="312" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="218" y="312" width="90" height="18" fill="#fff" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="75"  y="321" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">30</text>
  <text x="155" y="321" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#555">88.6</text>
  <text x="263" y="321" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" font-style="italic" fill="#aaa">NA</text>

  <!-- shift connectors: each pct_dissolved value climbs up into the row above's next_pct cell -->
  <line x1="200" y1="267" x2="218" y2="249" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="285" x2="218" y2="267" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="303" x2="218" y2="285" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="321" x2="218" y2="303" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

</svg>
