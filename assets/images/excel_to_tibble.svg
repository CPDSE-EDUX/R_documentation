<svg width="100%" viewBox="0 0 680 120" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Excel to Tibble transformation diagram</title>
  <desc>A spreadsheet icon on the left labelled XLSX with a sheet tab, with an arrow pointing to a compact grid table on the right labelled Tibble data frame.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="122" y="14" text-anchor="middle" dominant-baseline="central" font-size="11" letter-spacing="0.5" fill="var(--color-text-tertiary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">XLSX</text>

  <!-- Spreadsheet body -->
  <rect x="20" y="22" width="204" height="58" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(245, 244, 237);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>

  <!-- Row shading for header row -->
  <rect x="20" y="22" width="204" height="18" fill="var(--color-background-primary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>

  <!-- Grid lines -->
  <line x1="20" y1="60" x2="224" y2="60" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <line x1="88" y1="22" x2="88" y2="80" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <line x1="156" y1="22" x2="156" y2="80" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>

  <!-- Cell contents -->
  <text x="54" y="31" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">tablet</text>
  <text x="122" y="31" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">weight_mg</text>
  <text x="190" y="31" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">absorbance</text>

  <text x="54" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">1</text>
  <text x="122" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">498.2</text>
  <text x="190" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">0.149</text>

  <text x="54" y="70" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">2</text>
  <text x="122" y="70" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">501.0</text>
  <text x="190" y="70" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:11px">0.153</text>

  <!-- Sheet tab -->
  <path d="M20 80 L84 80 L84 94 L20 94 Z" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(245, 244, 237);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>
  <text x="52" y="87" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--color-text-tertiary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:8px">Sheet1</text>

  <!-- Arrow -->
  <line x1="233" y1="55" x2="301" y2="55" stroke="var(--color-border-primary)" marker-end="url(#arrow)" style="fill:none;stroke:rgb(115, 114, 108);stroke-width:1.5px"/>
  <text x="267" y="44" text-anchor="middle" dominant-baseline="central" font-size="8" fill="var(--color-text-tertiary)" style="fill:rgb(61, 61, 58);font-family:ui-monospace, monospace;font-size:8px">read_excel()</text>

  <text x="421" y="14" text-anchor="middle" dominant-baseline="central" font-size="10" letter-spacing="0.3" fill="var(--color-text-tertiary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:10px">TIBBLE DATA FRAME</text>

  <rect x="311" y="22" width="60" height="22" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(245, 244, 237);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>
  <rect x="371" y="22" width="80" height="22" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(245, 244, 237);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>
  <rect x="451" y="22" width="90" height="22" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" style="fill:rgb(245, 244, 237);stroke:rgba(31, 30, 29, 0.3);stroke-width:0.5px"/>
  <text x="341" y="33" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">tablet</text>
  <text x="411" y="33" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">weight_mg</text>
  <text x="496" y="33" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">absorbance</text>

  <rect x="311" y="44" width="60" height="22" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <rect x="371" y="44" width="80" height="22" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <rect x="451" y="44" width="90" height="22" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <text x="341" y="55" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">1</text>
  <text x="411" y="55" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">498.2</text>
  <text x="496" y="55" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">0.149</text>

  <rect x="311" y="66" width="60" height="22" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <rect x="371" y="66" width="80" height="22" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <rect x="451" y="66" width="90" height="22" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgba(31, 30, 29, 0.15);stroke-width:0.5px"/>
  <text x="341" y="77" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">2</text>
  <text x="411" y="77" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">501.0</text>
  <text x="496" y="77" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--color-text-secondary)" style="fill:rgb(61, 61, 58);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:12px">0.153</text>
</svg>
