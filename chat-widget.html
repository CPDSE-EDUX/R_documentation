<div id="cpdse-chatbot" class="cpdse-chatbot" data-open="false">
  <!-- The launcher stays hidden until API_URL in the script below is set to a real
       Cloudflare Worker URL (see _chatbot-worker/README.md); the script reveals it. -->
  <button
    id="cpdse-chat-launcher"
    class="cpdse-chat-launcher"
    type="button"
    hidden
    aria-controls="cpdse-chat-panel"
    aria-expanded="false"
  >
    <span class="cpdse-chat-launcher-dot" aria-hidden="true"></span>
    Chatbot
  </button>

  <section
    id="cpdse-chat-panel"
    class="cpdse-chat-panel"
    role="dialog"
    aria-modal="false"
    aria-label="R coding tutor chat"
    aria-hidden="true"
  >
    <header class="cpdse-chat-header">
      <div>
        <h2>R Tutor</h2>
        <p>Help with basic R questions, based on this website.</p>
      </div>
      <button id="cpdse-chat-close" class="cpdse-chat-close" type="button" aria-label="Close chat">×</button>
    </header>

    <div id="cpdse-chat-messages" class="cpdse-chat-messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

    <form id="cpdse-chat-form" class="cpdse-chat-form">
      <label class="cpdse-visually-hidden" for="cpdse-chat-input">Type your R question</label>
      <textarea
        id="cpdse-chat-input"
        class="cpdse-chat-input"
        rows="2"
        maxlength="1000"
        placeholder="Ask something like: How do I read a CSV in R?"
      ></textarea>
      <button id="cpdse-chat-send" class="cpdse-chat-send" type="submit">Send</button>
    </form>

    <p class="cpdse-chat-privacy">Your questions are sent to Google Gemini to generate answers.</p>
  </section>
</div>

<style>
  :root {
    --cpdse-chat-forest: #3c5e3e;
    --cpdse-chat-sage: #5f7d61;
    --cpdse-chat-gold: #e4d7a1;
    --cpdse-chat-ivory: #f6f1dc;
    --cpdse-chat-ink: #1f2a21;
    --cpdse-chat-soft: #f8f7f1;
    --cpdse-chat-border: rgba(60, 94, 62, 0.2);
    --cpdse-chat-shadow: 0 14px 40px rgba(15, 28, 18, 0.18);
    --cpdse-chat-radius: 18px;
  }

  .cpdse-chatbot {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 1100;
    font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
  }

  .cpdse-chat-launcher {
    display: none;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(228, 215, 161, 0.5);
    border-radius: 999px;
    padding: 10px 16px;
    background: linear-gradient(145deg, var(--cpdse-chat-forest), #2f4d31);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--cpdse-chat-shadow);
    cursor: pointer;
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  .cpdse-chat-launcher:hover {
    transform: translateY(-1px);
    box-shadow: 0 18px 34px rgba(15, 28, 18, 0.24);
  }

  .cpdse-chat-launcher-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--cpdse-chat-gold);
    box-shadow: 0 0 0 4px rgba(228, 215, 161, 0.2);
  }

  .cpdse-chat-panel {
    position: absolute;
    right: 0;
    bottom: 58px;
    width: min(390px, calc(100vw - 24px));
    height: min(560px, calc(100vh - 100px));
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #fffdf7 0%, #ffffff 42%);
    border: 1px solid var(--cpdse-chat-border);
    border-radius: var(--cpdse-chat-radius);
    box-shadow: var(--cpdse-chat-shadow);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px) scale(0.985);
    transform-origin: bottom right;
    transition: opacity 180ms ease, transform 180ms ease;
  }

  .cpdse-chatbot[data-open="true"] .cpdse-chat-panel {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }

  .cpdse-chat-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 14px 10px;
    background: linear-gradient(180deg, #f5f8f3 0%, #ffffff 100%);
    border-bottom: 1px solid var(--cpdse-chat-border);
  }

  .cpdse-chat-header h2 {
    margin: 0;
    padding: 0;
    border: 0;
    color: var(--cpdse-chat-ink);
    font-size: 16px;
    line-height: 1.25;
    font-weight: 700;
  }

  .cpdse-chat-header p {
    margin: 4px 0 0;
    color: #4f6652;
    font-size: 12px;
    line-height: 1.35;
  }

  .cpdse-chat-close {
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #4f6652;
    font-size: 22px;
    line-height: 1;
    padding: 0 8px;
    cursor: pointer;
  }

  .cpdse-chat-wakeup-note {
    margin: 10px 12px 0;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    color: #3f563f;
    background: #f5f1dc;
    border: 1px solid #e5dab2;
  }

  .cpdse-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background:
      radial-gradient(circle at 15% -20%, rgba(169, 187, 170, 0.2), transparent 36%),
      radial-gradient(circle at 95% 0%, rgba(228, 215, 161, 0.3), transparent 30%),
      #ffffff;
  }

  .cpdse-chat-message {
    max-width: 92%;
    margin-bottom: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
  }

  .cpdse-chat-message-user {
    margin-left: auto;
    background: var(--cpdse-chat-forest);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .cpdse-chat-message-assistant {
    margin-right: auto;
    background: var(--cpdse-chat-soft);
    color: #1f2a21;
    border: 1px solid rgba(60, 94, 62, 0.18);
    border-bottom-left-radius: 4px;
  }

  .cpdse-chat-message pre {
    margin: 8px 0 2px;
    border-radius: 10px;
    background: #f0f3eb;
    border: 1px solid rgba(60, 94, 62, 0.2);
    padding: 10px;
    overflow-x: auto;
    white-space: pre;
  }

  .cpdse-chat-message code {
    font-family: "Consolas", "Menlo", "Courier New", monospace;
    font-size: 12px;
    color: #1c3b1f;
  }

  .cpdse-chat-codewrap {
    position: relative;
  }

  .cpdse-chat-copy {
    position: absolute;
    top: 12px;
    right: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid rgba(60, 94, 62, 0.25);
    border-radius: 7px;
    background: #ffffff;
    color: var(--cpdse-chat-forest);
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    padding: 3px 7px;
    cursor: pointer;
    opacity: 0.85;
  }

  .cpdse-chat-copy:hover {
    opacity: 1;
  }

  .cpdse-chat-copy svg {
    width: 12px;
    height: 12px;
  }

  .cpdse-chat-message ul,
  .cpdse-chat-message ol {
    margin: 6px 0;
    padding-left: 20px;
  }

  .cpdse-chat-message li {
    margin: 2px 0;
  }

  .cpdse-chat-message a {
    color: var(--cpdse-chat-forest);
    font-weight: 600;
    text-decoration: underline;
  }

  .cpdse-chat-message-thinking {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .cpdse-chat-spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(60, 94, 62, 0.25);
    border-top-color: var(--cpdse-chat-forest);
    border-radius: 50%;
    animation: cpdse-chat-spin 1s linear infinite;
  }

  .cpdse-chat-form {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--cpdse-chat-border);
    background: #fffefb;
  }

  .cpdse-chat-input {
    resize: none;
    min-height: 42px;
    max-height: 120px;
    border-radius: 10px;
    border: 1px solid rgba(60, 94, 62, 0.28);
    padding: 9px 10px;
    font: inherit;
    color: #213025;
    background: #ffffff;
  }

  .cpdse-chat-send {
    align-self: end;
    border: 1px solid #355436;
    border-radius: 10px;
    background: #3c5e3e;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    cursor: pointer;
  }

  .cpdse-chat-send:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .cpdse-chat-privacy {
    margin: 0;
    padding: 0 12px 10px;
    font-size: 11px;
    color: #5e6f60;
    background: #fffefb;
  }

  .cpdse-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .cpdse-chatbot button:focus-visible,
  .cpdse-chatbot textarea:focus-visible {
    outline: 3px solid rgba(228, 215, 161, 0.9);
    outline-offset: 2px;
  }

  @media (max-width: 700px) {
    .cpdse-chatbot {
      right: 10px;
      left: 10px;
      bottom: 10px;
    }

    .cpdse-chat-launcher {
      margin-left: auto;
    }

    .cpdse-chat-panel {
      right: 0;
      left: 0;
      width: auto;
      height: min(74vh, 560px);
      bottom: 58px;
      transform-origin: bottom center;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cpdse-chat-panel,
    .cpdse-chat-launcher {
      transition: none;
    }

    .cpdse-chat-spinner {
      animation: none;
    }
  }

  @keyframes cpdse-chat-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<script>
  (function () {
    // Cloudflare Worker URL that proxies to Gemini (see _chatbot-worker/README.md).
    // The launcher button stays hidden until this is a real https:// URL.
    var API_URL = "https://r-docs.mittenentzwei.workers.dev";
    var REQUEST_TIMEOUT_MS = 30000;
    var MAX_HISTORY_TURNS = 6;

    // Retrieval budget for excerpts from search.json.
    var MAX_CONTEXT_ENTRIES = 6;
    var MAX_CONTEXT_CHARS = 8000;
    var MAX_ENTRY_CHARS = 2500;
    var MAX_SECTIONS_PER_PAGE = 2;
    var SEND_COOLDOWN_MS = 3000;

    // The chat history survives page changes within the same browser tab via
    // sessionStorage (cleared automatically when the tab is closed).
    var STORAGE_KEY = "cpdse-chat-history-v1";
    var OPEN_KEY = "cpdse-chat-open-v1";
    var MAX_STORED_MESSAGES = 40;

    // "R Tutor" must appear in this prompt: the Worker rejects requests without it.
    var SYSTEM_PROMPT = [
      'You are "R Tutor", a friendly teaching assistant on the website "Basic R for Pharmacy"',
      "(Center for Pharmaceutical Data Science Education). You help pharmacy students with basic R questions.",
      "",
      "RULES:",
      "1. GROUNDING: The question may include a SITE CONTEXT block with excerpts from this website,",
      "   each with a URL. When the context answers the question, base your answer on it and cite the",
      "   relevant page(s) as markdown links, e.g. See [read_csv()](url-from-context). Only cite URLs",
      "   that appear in the SITE CONTEXT block - never invent links.",
      "2. FALLBACK: If the question is about R but the site context does not cover it, give a brief,",
      "   correct answer using standard tidyverse practice and add one sentence noting that this topic",
      "   is not covered on this website.",
      "3. SCOPE: If the question is not about R, statistics, or this website, politely say you can only",
      "   help with R questions for this course.",
      "4. CODE STYLE: All R code you write MUST follow the course coding conventions below, even in",
      "   fallback answers.",
      "5. BREVITY: Answer ONLY what was asked, as simply as possible: one or two short sentences, then",
      "   one minimal runnable example. Do NOT explain optional arguments, edge cases, or related",
      "   features (e.g. when asked how to read a CSV, do not show how to skip lines or handle missing",
      "   values). If the site context covers such extras, you may end with ONE short sentence naming",
      "   them as things the student can ask about next - without showing code for them. Keep answers",
      '   under about 120 words. Use markdown: **bold**, `inline code`, fenced ```r code blocks, and',
      '   "-" bullet lists.',
      "",
      "COURSE CODING CONVENTIONS (summary):",
      "- snake_case names with units where relevant: powder_mass_mg, concentration_ug_ml, pct_label.",
      "- Always assign with <- (never =); use = only for function arguments. Spaces around <- and operators.",
      '- Print labelled results with cat(), e.g. cat("Mean content:", signif(mean_content_mg, 3), "mg\\n").',
      "- Inspect data frames with view(data) or head(data, 5), not by printing whole tables.",
      "- Keep full precision while computing; round only at print time with signif() or round().",
      "- Pipe with %>%, each step on its own line.",
      "- ggplot2: theme_classic(), axes labelled with units in parentheses via labs(), one + layer per",
      '  line, "steelblue" as the default single-series colour.',
      "- Comments explain why (and units), not what.",
      "",
      "Full conventions page: <SITE_ROOT>coding-conventions.html"
    ].join("\n");

    var root = document.getElementById("cpdse-chatbot");
    if (!root) return;

    var launcher = document.getElementById("cpdse-chat-launcher");
    var panel = document.getElementById("cpdse-chat-panel");
    var closeBtn = document.getElementById("cpdse-chat-close");
    var form = document.getElementById("cpdse-chat-form");
    var input = document.getElementById("cpdse-chat-input");
    var sendBtn = document.getElementById("cpdse-chat-send");
    var messagesEl = document.getElementById("cpdse-chat-messages");

    var messages = [];
    var indexPromise = null;
    var SITE_ROOT = getSiteRoot();

    if (/^https:\/\//.test(API_URL)) {
      launcher.hidden = false;
      launcher.style.display = "inline-flex";
    }

    function setOpen(isOpen) {
      root.setAttribute("data-open", String(isOpen));
      launcher.setAttribute("aria-expanded", String(isOpen));
      panel.setAttribute("aria-hidden", String(!isOpen));
      try {
        sessionStorage.setItem(OPEN_KEY, String(isOpen));
      } catch (err) {}
      if (isOpen) {
        ensureIndex();
        input.focus();
      }
    }

    function saveHistory() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-MAX_STORED_MESSAGES)));
      } catch (err) {
        // Storage unavailable: the chat still works, it just won't survive navigation.
      }
    }

    function pushMessage(role, content) {
      messages.push({ role: role, content: content });
      saveHistory();
    }

    function restoreSession() {
      var stored = null;
      try {
        stored = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null");
      } catch (err) {
        stored = null;
      }
      if (Array.isArray(stored)) {
        for (var i = 0; i < stored.length; i += 1) {
          var m = stored[i];
          if (m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string") {
            messages.push({ role: m.role, content: m.content });
            appendMessage(m.role, m.content);
          }
        }
      }
      if (!messages.length) {
        appendMessage(
          "assistant",
          "Hi, I am your R Tutor. Ask me a small R coding question and I will point you to the right pages on this website."
        );
      }

      var wasOpen = null;
      try {
        wasOpen = sessionStorage.getItem(OPEN_KEY);
      } catch (err) {}
      if (wasOpen === "true") {
        // Reopen directly (not via setOpen) so page focus is not stolen on load.
        root.setAttribute("data-open", "true");
        launcher.setAttribute("aria-expanded", "true");
        panel.setAttribute("aria-hidden", "false");
        ensureIndex();
      }
    }

    /* ---------- Site root + retrieval over Quarto's search.json ---------- */

    function getSiteRoot() {
      // Every Quarto page loads site_libs scripts by page-relative path, which
      // reveals the site root even under a subpath like /R_documentation/.
      var libScript = document.querySelector('script[src*="site_libs/"]');
      if (libScript) {
        var abs = new URL(libScript.getAttribute("src"), document.baseURI).href;
        return abs.slice(0, abs.indexOf("site_libs/"));
      }
      return new URL("./", document.baseURI).href;
    }

    function decodeEntities(text) {
      return String(text)
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&");
    }

    var STOPWORDS = {
      the: 1, a: 1, an: 1, and: 1, or: 1, of: 1, in: 1, on: 1, to: 1, for: 1,
      with: 1, how: 1, do: 1, does: 1, can: 1, you: 1, what: 1, is: 1, are: 1,
      my: 1, me: 1, it: 1, that: 1, this: 1, when: 1, why: 1, i: 1, should: 1,
      would: 1, please: 1
    };

    function tokenize(text) {
      // Keep _ % < > - so R tokens like %>%, <-, group_by and lm survive.
      return String(text)
        .toLowerCase()
        .replace(/[^a-z0-9_%<>-]+/g, " ")
        .split(/\s+/)
        .filter(function (t) {
          return t.length >= 2 && !STOPWORDS[t];
        });
    }

    function buildIndex(rawEntries) {
      var index = { entries: [], df: {}, n: 0 };
      if (!Array.isArray(rawEntries)) return index;

      for (var i = 0; i < rawEntries.length; i += 1) {
        var raw = rawEntries[i];
        if (!raw || !raw.href) continue;
        var title = decodeEntities(raw.title || "");
        var section = decodeEntities(raw.section || "");
        var text = decodeEntities(raw.text || "");

        var counts = {};
        var tokens = tokenize(title + " " + section + " " + text);
        for (var j = 0; j < tokens.length; j += 1) {
          counts[tokens[j]] = (counts[tokens[j]] || 0) + 1;
        }
        for (var token in counts) {
          index.df[token] = (index.df[token] || 0) + 1;
        }

        // Include both raw and underscore/dash-split forms so the query token
        // "csv" boosts the title "read_csv( )".
        var titleLower = title.toLowerCase();
        var sectionLower = section.toLowerCase();
        index.entries.push({
          href: raw.href,
          title: title,
          section: section,
          text: text,
          counts: counts,
          titleNorm: titleLower + " " + titleLower.replace(/[_-]+/g, " "),
          sectionNorm: sectionLower + " " + sectionLower.replace(/[_-]+/g, " ")
        });
      }
      index.n = index.entries.length;
      return index;
    }

    function ensureIndex() {
      if (!indexPromise) {
        indexPromise = fetchWithTimeout(SITE_ROOT + "search.json", { method: "GET" }, 15000)
          .then(function (response) {
            if (!response.ok) throw new Error("search.json returned " + response.status);
            return response.json();
          })
          .then(buildIndex)
          .catch(function () {
            // Degrade to answering without site context; retry on the next question.
            indexPromise = null;
            return null;
          });
      }
      return indexPromise;
    }

    function scoreEntry(entry, queryTokens, df, nEntries) {
      var score = 0;
      for (var i = 0; i < queryTokens.length; i += 1) {
        var token = queryTokens[i];
        var tf = entry.counts[token] || 0;
        if (!tf) continue;
        var idf = Math.log(1 + nEntries / (1 + (df[token] || 0)));
        var boost = 1;
        if (entry.titleNorm.indexOf(token) !== -1) boost += 2;
        if (entry.sectionNorm.indexOf(token) !== -1) boost += 1;
        score += idf * Math.min(tf, 3) * boost;
      }
      return score;
    }

    function selectContext(index, question) {
      if (!index || !index.n) return [];
      var queryTokens = tokenize(question);
      if (!queryTokens.length) return [];

      var scored = [];
      for (var i = 0; i < index.entries.length; i += 1) {
        var score = scoreEntry(index.entries[i], queryTokens, index.df, index.n);
        if (score > 0) scored.push({ entry: index.entries[i], score: score });
      }
      scored.sort(function (a, b) {
        return b.score - a.score;
      });

      var picked = [];
      var perPage = {};
      var totalChars = 0;
      for (var k = 0; k < scored.length; k += 1) {
        if (picked.length >= MAX_CONTEXT_ENTRIES) break;
        var entry = scored[k].entry;
        var page = entry.href.split("#")[0];
        if ((perPage[page] || 0) >= MAX_SECTIONS_PER_PAGE) continue;

        var text = entry.text;
        if (text.length > MAX_ENTRY_CHARS) {
          text = text.slice(0, MAX_ENTRY_CHARS) + " [...]";
        }
        if (picked.length > 0 && totalChars + text.length > MAX_CONTEXT_CHARS) continue;

        perPage[page] = (perPage[page] || 0) + 1;
        totalChars += text.length;
        picked.push({
          title: entry.title,
          section: entry.section,
          url: SITE_ROOT + entry.href,
          text: text
        });
      }
      return picked;
    }

    /* ---------- Prompt assembly + Worker request ---------- */

    function buildFinalUserText(question, context) {
      if (!context.length) {
        return "SITE CONTEXT: (none found for this question)\n\nQUESTION: " + question;
      }
      var blocks = [];
      for (var i = 0; i < context.length; i += 1) {
        var c = context[i];
        blocks.push(
          "[" + (i + 1) + '] Page: "' + c.title + '"' +
          (c.section ? ' - Section: "' + c.section + '"' : "") +
          "\nURL: " + c.url +
          "\n" + c.text
        );
      }
      return (
        "SITE CONTEXT (excerpts from the course website):\n\n" +
        blocks.join("\n\n") +
        "\n\nQUESTION: " + question
      );
    }

    function buildShortHistory() {
      var turns = [];
      var currentUser = null;

      for (var i = 0; i < messages.length; i += 1) {
        var m = messages[i];
        if (m.role === "user") {
          currentUser = m.content;
        } else if (m.role === "assistant" && currentUser) {
          turns.push([currentUser, m.content]);
          currentUser = null;
        }
      }

      if (turns.length > MAX_HISTORY_TURNS) {
        return turns.slice(turns.length - MAX_HISTORY_TURNS);
      }
      return turns;
    }

    function buildContents(history, finalUserText) {
      var contents = [];
      for (var i = 0; i < history.length; i += 1) {
        contents.push({ role: "user", parts: [{ text: history[i][0] }] });
        contents.push({ role: "model", parts: [{ text: history[i][1] }] });
      }
      contents.push({ role: "user", parts: [{ text: finalUserText }] });
      return contents;
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      var controller = new AbortController();
      var timer = setTimeout(function () {
        controller.abort();
      }, timeoutMs);

      var merged = Object.assign({}, options || {}, { signal: controller.signal });
      try {
        return await fetch(url, merged);
      } finally {
        clearTimeout(timer);
      }
    }

    async function getAssistantReply(question) {
      var index = await ensureIndex();
      var context = selectContext(index, question);
      var payload = {
        system: SYSTEM_PROMPT.replace(/<SITE_ROOT>/g, SITE_ROOT),
        contents: buildContents(buildShortHistory(), buildFinalUserText(question, context))
      };

      var response = await fetchWithTimeout(
        API_URL,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        },
        REQUEST_TIMEOUT_MS
      );

      if (response.status === 429) {
        var limitError = new Error("Rate limited");
        limitError.code = "rate_limited";
        throw limitError;
      }
      if (!response.ok) {
        var upstreamError = new Error("Request failed with status " + response.status);
        upstreamError.code = "upstream";
        throw upstreamError;
      }

      var data = await response.json();
      if (!data || typeof data.reply !== "string" || !data.reply.trim()) {
        var emptyError = new Error("No assistant reply in response.");
        emptyError.code = "upstream";
        throw emptyError;
      }
      return data.reply;
    }

    /* ---------- Rendering (minimal markdown: code, bold, links, lists) ---------- */

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderInline(escaped) {
      // Input is already HTML-escaped; only https? URLs become links, so no
      // javascript: injection, and quotes cannot break out of the href.
      return escaped
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
        );
    }

    function renderTextBlock(raw) {
      var lines = escapeHtml(raw).split("\n");
      var html = "";
      var listTag = null;

      function closeList() {
        if (listTag) {
          html += "</" + listTag + ">";
          listTag = null;
        }
      }

      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i];
        var bullet = line.match(/^\s*[-*]\s+(.*)$/);
        var numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
        var heading = line.match(/^\s*#{1,4}\s+(.*)$/);

        if (bullet || numbered) {
          var wanted = bullet ? "ul" : "ol";
          if (listTag !== wanted) {
            closeList();
            html += "<" + wanted + ">";
            listTag = wanted;
          }
          html += "<li>" + renderInline((bullet || numbered)[1]) + "</li>";
        } else {
          closeList();
          if (heading) {
            html += "<p><strong>" + renderInline(heading[1]) + "</strong></p>";
          } else if (line.trim()) {
            html += "<p>" + renderInline(line) + "</p>";
          }
        }
      }
      closeList();
      return html;
    }

    function formatAssistantText(text) {
      var raw = String(text || "");
      var parts = raw.split(/```[a-zA-Z]*\n?|```/g);
      if (parts.length === 1) {
        return renderTextBlock(raw);
      }

      var html = "";
      for (var i = 0; i < parts.length; i += 1) {
        if (!parts[i]) continue;
        if (i % 2 === 1) {
          html += "<pre><code>" + escapeHtml(parts[i].trim()) + "</code></pre>";
        } else {
          html += renderTextBlock(parts[i]);
        }
      }
      return html;
    }

    var COPY_SVG = '<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/></svg>';

    function addCopyButtons(wrap) {
      Array.prototype.forEach.call(wrap.querySelectorAll("pre"), function (pre) {
        var holder = document.createElement("div");
        holder.className = "cpdse-chat-codewrap";
        pre.parentNode.insertBefore(holder, pre);
        holder.appendChild(pre);

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cpdse-chat-copy";
        btn.setAttribute("aria-label", "Copy code");
        btn.innerHTML = COPY_SVG + "<span>Copy</span>";

        btn.addEventListener("click", function () {
          var code = pre.textContent;
          var label = btn.querySelector("span");
          function flash(text) {
            label.textContent = text;
            setTimeout(function () {
              label.textContent = "Copy";
            }, 1500);
          }
          // Same fallback chain as the site's editor Copy buttons (scripts.html):
          // older browsers, non-secure contexts, or a rejected Clipboard API call.
          function legacyCopy() {
            var ta = document.createElement("textarea");
            ta.value = code;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try {
              ok = document.execCommand("copy");
            } catch (err) {}
            document.body.removeChild(ta);
            flash(ok ? "Copied!" : "Copy failed");
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(function () {
              flash("Copied!");
            }, legacyCopy);
          } else {
            legacyCopy();
          }
        });

        holder.appendChild(btn);
      });
    }

    function appendMessage(role, content, opts) {
      var options = opts || {};
      var wrap = document.createElement("div");
      wrap.className = "cpdse-chat-message cpdse-chat-message-" + role;
      if (options.id) wrap.id = options.id;

      if (options.thinking) {
        wrap.innerHTML = "<span class=\"cpdse-chat-message-thinking\"><span class=\"cpdse-chat-spinner\" aria-hidden=\"true\"></span><span>Thinking...</span></span>";
      } else if (role === "assistant") {
        wrap.innerHTML = formatAssistantText(content);
        addCopyButtons(wrap);
      } else {
        wrap.innerHTML = "<p>" + escapeHtml(content).replace(/\n/g, "<br>") + "</p>";
      }

      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeById(id) {
      var el = document.getElementById(id);
      if (el && el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }

    /* ---------- Send flow ---------- */

    async function handleSend(text) {
      // The disabled flag also guards Enter-key sends during a request or cooldown.
      if (sendBtn.disabled) return;
      var question = String(text || "").trim();
      if (!question) return;

      appendMessage("user", question);
      pushMessage("user", question);

      input.value = "";
      input.focus();
      sendBtn.disabled = true;
      var thinkingId = "cpdse-chat-thinking";
      appendMessage("assistant", "", { thinking: true, id: thinkingId });

      try {
        var reply = await getAssistantReply(question);
        removeById(thinkingId);
        appendMessage("assistant", reply);
        pushMessage("assistant", reply);
      } catch (error) {
        removeById(thinkingId);
        var errorText = "I could not reach the tutor just now. Please try again in a few seconds.";
        if (String(error && error.name) === "AbortError") {
          errorText = "The request timed out while waiting for the assistant. Please try again.";
        } else if (error && error.code === "rate_limited") {
          errorText = "The tutor has hit its free usage limit right now. Please wait a minute and try again.";
        } else if (error && error.code === "upstream") {
          errorText = "The tutor had a problem generating an answer. Please rephrase your question or try again.";
        }
        appendMessage("assistant", errorText);
        pushMessage("assistant", errorText);
      } finally {
        // Short cooldown softens the shared free-tier rate limit in a classroom.
        setTimeout(function () {
          sendBtn.disabled = false;
        }, SEND_COOLDOWN_MS);
      }
    }

    launcher.addEventListener("click", function () {
      setOpen(root.getAttribute("data-open") !== "true");
    });

    closeBtn.addEventListener("click", function () {
      setOpen(false);
      launcher.focus();
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      handleSend(input.value);
    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSend(input.value);
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && root.getAttribute("data-open") === "true") {
        setOpen(false);
        launcher.focus();
      }
    });

    restoreSession();

    // Console access for tuning retrieval and rendering (not used by the widget itself).
    window.__cpdseChatDebug = {
      siteRoot: SITE_ROOT,
      ensureIndex: ensureIndex,
      selectContext: function (question) {
        return ensureIndex().then(function (index) {
          return selectContext(index, question);
        });
      },
      formatAssistantText: formatAssistantText,
      appendMessage: appendMessage
    };
  })();
</script>
