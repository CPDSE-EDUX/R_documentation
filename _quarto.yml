project:
  type: website
  output-dir: _site
  resources:
    - assets/data/**

website:
  title: "Basic R for Pharmacy"
  description: "R function reference for pharmaceutical sciences — Center for Pharmaceutical Data Science Education (CPDSE)"
  favicon: assets/images/favicon.ico

  navbar:
    background: "#3C5E3E"
    foreground: "#E4D7A1"
    title: "CPDSE"
    title-href: "https://cpdse.dk"
    logo: /assets/images/logo_snake_gold.png
    logo-alt: "CPDSE"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Topics covered"
        menu:
          - text: "Getting Started"
            href: topics/getting-started.qmd
          - text: "---"
          - text: "Data Handling"
            href: topics/data-handling.qmd
          - text: "Descriptive Statistics"
            href: topics/descriptive-stats.qmd
          - text: "Visualization"
            href: topics/visualization.qmd
      - text: "Functions"
        href: functions/index.qmd
      - text: Glossary
        href: glossary.qmd
      - text: Coding Conventions
        href: coding-conventions.qmd
    right:
      - icon: github
        href: https://github.com/CPDSE-EDUX/R_documentation
        aria-label: GitHub

  sidebar:
    - title: "Functions"
      style: "docked"
      background: "#F6F1DC"
      collapse-level: 1
      contents:
        - section: "Import & Create"
          contents:
            - text: "read_csv( )"
              href: functions/read-csv.qmd
            - text: "tibble( )"
              href: functions/tibble.qmd
        - section: "Transform"
          contents:
            - text: "group_by( )"
              href: functions/group-by.qmd
            - text: "mutate( )"
              href: functions/mutate.qmd
            - text: "summarise( )"
              href: functions/summarise.qmd
        - section: "Report"
          contents:
            - text: "cat( )"
              href: functions/cat.qmd
            - text: "round( )"
              href: functions/round.qmd
            - text: "signif( )"
              href: functions/signif.qmd

  page-footer:
    background: "#3C5E3E"
    foreground: "#E4D7A1"
    left: "[Center for Pharmaceutical Data Science Education](https://cpdse.dk)"
    center: "Built with [Quarto](https://quarto.org) and [webR](https://webr.r-wasm.org)"
    right: "© CPDSE 2026"

  search: true

filters:
  - webr

webr:
  packages:
    - curl
    - dplyr
    - ggplot2
    - readr
    - tibble
  cell-options:
    warning: false
    message: false
  show-startup-message: false

format:
  html:
    theme: [cosmo, custom.scss]
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    highlight-style: github
    include-in-header: []
    include-after-body:
      - scripts.html
      - chat-widget.html
