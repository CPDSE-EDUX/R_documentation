      style: "docked"
      background: "#F6F1DC"
      collapse-level: 1
      contents:
        - section: "Import & Create"
          contents:
            - text: "read_csv( )"
              href: functions/read-csv.qmd
            - text: "read_excel( )"
              href: functions/read-excel.qmd
            - text: "tibble( )"
              href: functions/tibble.qmd
        - section: "Inspect"
          contents:
            - text: "glimpse( )"
              href: functions/glimpse.qmd
            - text: "head( )"
              href: functions/head.qmd
        - section: "Transform"
          contents:
            - text: "arrange( )"
              href: functions/arrange.qmd
            - text: "filter( )"
              href: functions/filter.qmd
            - text: "group_by( )"
              href: functions/group-by.qmd
            - text: "mutate( )"
              href: functions/mutate.qmd
            - text: "summarise( )"
              href: functions/summarise.qmd
        - section: "Model"
          contents:
            - text: "coef( )"
              href: functions/coef.qmd
            - text: "lm( )"
              href: functions/lm.qmd
            - text: "predict( )"
              href: functions/predict.qmd
            - text: "summary( )"
              href: functions/summary.qmd
        - section: "Visualize"
          contents:
            - text: "ggplot( )"
              href: functions/ggplot.qmd
        - section: "Report"
          contents:
