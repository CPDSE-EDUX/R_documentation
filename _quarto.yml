  page-footer:
    background: "#3C5E3E"
    foreground: "#E4D7A1"
    left: "[Center for Pharmaceutical Data Science Education](https://cpdse.dk)"
    center: "Built with [Quarto](https://quarto.org) and [webR](https://webr.r-wasm.org)"
    right: "© CPDSE 2026"

  search: true

# NOTE: keep all webr config here at project level. Quarto does NOT deep-merge
# this custom key, so a `webr:` block in a page's front matter would silently
# replace everything below for that page.
webr:
  packages:
    # tidyverse (metapackage) covers dplyr, ggplot2, readr, tibble, etc.
    # Pre-installing it makes `library(tidyverse)` in cells a fast no-op,
    # so no "Downloading webR package" noise appears in cell output.
    - tidyverse
  resources:
    # Copied into the webR virtual filesystem on every interactive page, so
    # cells can call read_csv("data/..."). Paths are relative to the page;
    # all pages with webr cells live one directory deep (topics/, functions/).
    # A directory entry is expanded recursively by the live extension (tree()
    # in live.lua), so mounting ../data covers every dataset — current and
    # future — without maintaining a per-file list.
    - ../data
  cell-options:
    warning: false

format:
  live-html:
    theme: [cosmo, custom.scss]
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    highlight-style: github
    include-in-header: []
    include-after-body:
      - scripts.html
      - chat-widget.html
