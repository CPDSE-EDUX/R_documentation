    foreground: "#E4D7A1"
    title: "CPDSE"
    title-href: "https://cpdse.dk"
    logo: /assets/layout/logo_snake_gold.png
    logo-alt: "CPDSE"
    left:
      - text: "Topics covered"
        menu:
          - text: "Getting Started"
            href: topics/getting-started.qmd
          - text: "Setting Up an R Project"
            href: topics/project-setup.qmd
          - text: "R Basics"
            href: topics/r-basics.qmd
          - text: "Error Handling and Debugging"
            href: topics/error-handling-and-debugging.qmd
          - text: "---"
          - text: "Data Handling"
            href: topics/data-handling.qmd
          - text: "Visualization"
            href: topics/visualization.qmd
          - text: "Math Operations"
            href: topics/math-operations.qmd
          - text: "Pipe Operator (%>%)"
            href: topics/pipe-operator.qmd
          - text: "Descriptive Statistics"
            href: topics/descriptive-stats.qmd
          - text: "Linear Regression"
            href: topics/linear-regression.qmd
      - text: "Functions"
        href: functions/index.qmd
      - text: "Datasets"
        href: datasets/index.qmd
      - text: Glossary
        href: glossary.qmd
      - text: Coding Conventions
        href: coding-conventions.qmd
    right:
      - icon: github
        href: https://github.com/CPDSE-EDUX/R_documentation
        aria-label: GitHub

  sidebar:
